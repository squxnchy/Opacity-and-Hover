<!DOCTYPE html>
<html>
<head>
<title>Opacity and Hover </title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
}

table {
  margin-left: auto;
  margin-right: auto;
  background-color: #eef3f7;
  border: 2px solid #5b7c99;
  border-radius: 12px;
  box-shadow: 4px 4px 12px gray;
  padding: 10px;
}

td {
  padding: 15px;
}

.pic1 {
  opacity: 0.4;
}

.pic1:hover {
  opacity: 1.0;
}

.pic2 {
  opacity: 0.9;
  transition: opacity 0.5s;
}

.pic2:hover {
  opacity: 0.3;
}
</style>
</head>
<body>

<h2>Opacity and Hover</h2>
<p>Hover over each picture to see how it changes (:</p>

<table>
  <tr>
    <td><img class="pic1" src="Travel1.jpg" alt="Travel photo one" width="200"></td>
    <td><img class="pic2" src="Travel2.jpg" alt="Travel photo two" width="200"></td>
  </tr>
  <tr>
    <td>Starts faded, turns solid on hover</td>
    <td>Starts solid, fades on hover</td>
  </tr>
</table>

</body>
</html>
